[project]
name = "specflow-solver"
version = "2.0.0.dev0"
description = "Pseudo-spectral solver for periodic flows, built on PyTorch."
requires-python = ">=3.12"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING.LESSER"]
dependencies = ["torch", "h5py"]

[project.optional-dependencies]
cases = ["matplotlib"]

[dependency-groups]
dev = ["pytest", "ruff", "pyright"]

[build-system]
requires = ["uv_build>=0.9.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "specflow"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "N", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pyright]
include = ["src", "tests", "cases", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["gpu: needs a CUDA device; kept out of CI"]

[tool.uv]
constraint-dependencies = ["torch==2.5.1"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
