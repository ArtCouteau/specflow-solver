[project]
name = "specflow-solver"
version = "2.0.0.dev0"
description = "Pseudo-spectral solver for periodic flows, built on PyTorch."
requires-python = ">=3.12"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING.LESSER"]
dependencies = ["torch", "h5py"]

[project.optional-dependencies]
cases = ["matplotlib"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.9.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "specflow"
